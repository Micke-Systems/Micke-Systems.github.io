<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Systems | Autodesk Revit Tools</title>

        <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        /* Заставляем документ жестко держать размеры экрана */
        html, body {
            width: 100vw;
            height: 100vh;
            min-height: 100vh;
            overflow: hidden; /* Запрещает появление полос прокрутки */
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center; /* Центр по горизонтали */
            align-items: center;     /* Центр по вертикали */
            padding: 20px;
            
            /* ИДЕАЛЬНОЕ МАСШТАБИРОВАНИЕ ФОНА */
            background-image: url('Revit Add-In Automation Showcase.png'); /* Укажите имя вашей картинки */
            background-size: cover;        /* Вписывает картинку, обрезая лишнее без искажений */
            background-position: center;   /* Картинка масштабируется ровно от центра */
            background-repeat: no-repeat;
        }
        
        /* АДАПТИВНАЯ КАРТОЧКА С ТЕКСТОМ */
        .card {
            background: rgba(30, 30, 30, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            
            /* Масштабируемая ширина */
            width: 90%;            /* На смартфонах займет 90% ширины экрана */
            max-width: 440px;      /* На больших экранах не станет шире 440px */
            
            /* Адаптивные отступы */
            padding: 5vh 30px;     /* Высота отступов зависит от высоты экрана (Viewport Height) */
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            font-size: clamp(20px, 4vw, 28px); /* Размер шрифта подстраивается под экран */
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        p {
            font-size: clamp(14px, 2.5vw, 16px); /* Текст плавно уменьшается на смартфонах */
            color: #e0e0e0;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .btn {
            display: inline-block;
            background-color: #0076ff;
            color: #fff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.2s;
        }
        
        .btn:hover {
            background-color: #0056b3;
        }
    </style>




    
</head>
<body>

    <!-- Центральный блок с текстом -->
    <div class="card">
        <h1>M-Systems</h1>
        <p>Приветствуем! Сайт находится в разработке. Скоро здесь появится подробная информация о наших плагинах, инструментах автоматизации и решениях для Autodesk Revit.</p>
        
        <a href="mailto:info@example.com" class="btn">Связаться с нами</a>
    </div>

</body>
</html>
