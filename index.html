<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Systems | Autodesk Revit Tools</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Убирает прокрутку, если она не нужна */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            
            /* ФОНОВОЕ ИЗОБРАЖЕНИЕ НА ВЕСЬ ЭКРАН */
            /* Укажите здесь точное имя вашей фоновой картинки */
            background-image: url('photo.jpg'); 
            background-size: cover;        /* Растягивает изображение без искажений */
            background-position: center;   /* Центрирует картинку */
            background-repeat: no-repeat;  /* Отменяет повторение */
        }
        
        /* ТЕМНАЯ ПЛАШКА ПОВЕРХ ФОНА */
        .card {
            background: rgba(30, 30, 30, 0.75); /* Темный полупрозрачный фон */
            backdrop-filter: blur(10px);        /* Эффект размытия под плашкой */
            -webkit-backdrop-filter: blur(10px);
            
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            padding: 35px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        
        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        p {
            font-size: 15px;
            color: #e0e0e0;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        /* СТИЛЬ КНОПКИ */
        .btn {
            display: inline-block;
            background-color: #0076ff;
            color: #fff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.2s, transform 0.1s;
        }
        
        .btn:hover {
            background-color: #0056b3;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Центральный блок с текстом -->
    <div class="card">
        <h1>M-Systems</h1>
        <p>Приветствуем! Сайт находится в разработке. Скоро здесь появится подробная информация о наших плагинах, инструментах автоматизации и решениях для Autodesk Revit.</p>
        
        <a href="mailto:info@example.com" class="btn">Связаться с нами</a>
    </div>

</body>
</html>
