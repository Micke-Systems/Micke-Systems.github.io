<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Systems | Сайт-визитка</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 30px 20px;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid #0076ff;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #111;
        }
        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background-color: #0076ff;
            color: #fff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ЗАМЕНИТЕ "photo.jpg" НА РЕАЛЬНОЕ ИМЯ ВАШЕЙ КАРТИНКИ -->
        <img src="Revit Add-In Automation Showcase.png" alt="M-Systems Logo" class="profile-img">
        
        <h1>M-Systems</h1>
        <p>Приветствуем! Сайт находится в разработке. Скоро здесь появится подробная информация о наших проектах и услугах.</p>
        
        <a href="mailto:info@example.com" class="btn">Связаться с нами</a>
    </div>

</body>
</html>
