<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Systems | Сайт-визитка</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            
            /* НАСТРОЙКА ФОНА НА ВЕСЬ ЭКРАН */
            /* Замените photo.jpg на точное имя вашей картинки */
            background-image: url('Revit Add-In Automation Showcase.png'); 
            background-size: cover;        /* Растягивает картинку, сохраняя пропорции */
            background-position: center;   /* Центрирует изображение */
            background-repeat: no-repeat;  /* Запрещает размножение картинки */
            background-attachment: fixed;  /* Фиксирует фон при скролле */
        }
        .card {
            /* Эффект матового стекла поверх фоновой картинки */
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 16px;
            color: #e0e0e0;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #0076ff;
            color: #fff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>M-Systems</h1>
        <p>Приветствуем! Сайт находится в разработке. Скоро здесь появится подробная информация о наших проектах и услугах.</p>
        
        <a href="mailto:info@example.com" class="btn">Связаться с нами</a>
    </div>

</body>
</html>
