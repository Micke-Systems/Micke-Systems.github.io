<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Systems | Autodesk Revit Tools</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        /* Задаем жесткие рамки под размер окна браузера */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Убирает любые полосы прокрутки */
            position: relative;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            display: flex;
            
            /* ПОЗИЦИОНИРОВАНИЕ ПЛАШКИ В ПРАВЫЙ НИЖНИЙ УГОЛ */
            justify-content: flex-end; 
            align-items: flex-end;     
            padding: 30px;             /* Отступ плашки от краев экрана */
        }
        
        /* СТИЛИ ДЛЯ ИДЕАЛЬНОГО МАСШТАБИРОВАНИЯ КАРТИНКИ */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* object-fit: fill заставит картинку жестко вписываться в экран */
            /* Если пропорции экрана сильно изменятся, она может немного сжаться, но зато НИКОГДА не обрежется */
            object-fit: fill; 
            
            z-index: 1; /* Отправляем картинку на самый задний план */
        }
        
        /* ТЕМНАЯ ПЛАШКА В УГЛУ */
        .card {
            background: rgba(30, 30, 30, 0.30); /* Плотный темный фон */
            backdrop-filter: blur(10px);        /* Эффект размытия под плашкой */
            -webkit-backdrop-filter: blur(10px);
            
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            
            width: 100%;
            max-width: 400px; 
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            
            z-index: 10; /* Поднимаем плашку над фоновой картинкой */
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        p {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .btn {
            display: inline-block;
            background-color: #0076ff;
            color: #fff;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        
        .btn:hover {
            background-color: #0056b3;
        }
        
        /* Адаптация под маленькие экраны смартфонов */
        @media (max-width: 480px) {
            body {
                justify-content: center; 
                align-items: center;
                padding: 15px;
            }
            .card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ФОНОВАЯ КАРТИНКА ТЕПЕРЬ ТУТ -->
    <!-- реальное имя ниже -->
    <img src="Revit Add-In Automation Showcase.png" alt="Autodesk Revit Custom Tools" class="bg-image">

    <!-- ИНФОРМАЦИОННАЯ КАРТОЧКА -->
    <div class="card">
        <h1>M-Systems</h1>
        <p>Приветствуем! Сайт находится в разработке. Скоро здесь появится подробная информация о наших плагинах, инструментах автоматизации и решениях для Autodesk Revit.</p>
        
        <a href="mailto:info@example.com" class="btn">Связаться с нами</a>
    </div>

</body>
</html>
