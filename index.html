
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Michael Stoler | Facade Engineering & BIM Automation</title>

    <style>
        @font-face {
            font-family: "ISOCPEUR";
            src: url("fonts/ISOCPEUR.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #ffffff;
        }

        /* MAIN HERO */

        .hero {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background: #dce5ec;
        }

        .hero-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                rgba(5, 22, 38, 0.48) 0%,
                rgba(5, 22, 38, 0.16) 48%,
                rgba(5, 22, 38, 0.02) 100%
            );
        }

        /* NAVIGATION */

        .navigation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 34px 6%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 2;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 38px;
        }

        .nav-links a {
            font-family: "ISOCPEUR", Arial, sans-serif;
            font-size: 19px;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.25s ease;
        }

        .nav-links a:hover {
            opacity: 0.65;
        }

        /* HERO TEXT */

        .hero-content {
            position: absolute;
            left: 8%;
            bottom: 13%;
            z-index: 2;
            max-width: 760px;
        }

        .hero-name {
            font-family: "ISOCPEUR", Arial, sans-serif;
            font-size: clamp(48px, 7vw, 96px);
            font-weight: normal;
            letter-spacing: 3px;
            line-height: 1;
            margin-bottom: 22px;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.25);
        }

        .hero-title {
            font-size: clamp(16px, 2vw, 23px);
            line-height: 1.5;
            letter-spacing: 1.2px;
            font-weight: 400;
            max-width: 650px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        }

        .hero-subtitle {
            margin-top: 13px;
            font-size: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
        }

        /* SCROLL INDICATOR */

        .scroll-hint {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            color: white;
            font-size: 30px;
            text-decoration: none;
            opacity: 0.8;
            animation: float 2s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(-50%, 0);
            }
            50% {
                transform: translate(-50%, 8px);
            }
        }

        /* TEMPORARY SECOND SCREEN */

        .next-screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #edf1f4;
            color: #243746;
            text-align: center;
            padding: 60px 24px;
        }

        .next-screen h2 {
            font-family: "ISOCPEUR", Arial, sans-serif;
            font-size: clamp(32px, 5vw, 56px);
            font-weight: normal;
        }

        /* MOBILE */

        @media (max-width: 700px) {
            .navigation {
                justify-content: center;
                padding: 24px 16px;
            }

            .nav-links {
                gap: 16px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-links a {
                font-size: 15px;
            }

            .hero-content {
                left: 7%;
                right: 7%;
                bottom: 12%;
            }

            .hero-name {
                font-size: clamp(42px, 11vw, 64px);
                letter-spacing: 1px;
            }

            .hero-title {
                font-size: 16px;
            }

            .hero-subtitle {
                font-size: 12px;
                line-height: 1.6;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .scroll-hint {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <main>
        <section class="hero" id="home">

            <img
                src="Michael Stoler Architectural Portfolio.png"
                alt="Architectural portfolio panorama"
                class="hero-image"
            >

            <div class="hero-overlay"></div>

            <nav class="navigation">
                <div class="nav-links">
                    <a href="#about">ABOUT</a>
                    <a href="#projects">PROJECTS</a>
                    <a href="#automation">REVIT AUTOMATION</a>
                    <a href="#contact">CONTACT</a>
                </div>
            </nav>

            <div class="hero-content">
                <h1 class="hero-name">MICHAEL STOLER</h1>

                <p class="hero-title">
                    Facade Engineering & Technical Management
                </p>

                <p class="hero-subtitle">
                    Curtain Walls · Building Envelopes · BIM · Revit API
                </p>
            </div>

            <a href="#about" class="scroll-hint" aria-label="Scroll down">
                ↓
            </a>

        </section>

        <section class="next-screen" id="about">
            <h2>ABOUT & EXPERTISE</h2>
        </section>

        <section class="next-screen" id="projects">
            <h2>SELECTED PROJECTS</h2>
        </section>

        <section class="next-screen" id="automation">
            <h2>REVIT AUTOMATION</h2>
        </section>

        <section class="next-screen" id="contact">
            <h2>CONTACT</h2>
        </section>
    </main>

</body>
</html>
