<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Systems | Autodesk Revit Tools</title>
       <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            display: flex;
            justify-content: flex-end; 
            align-items: flex-end;     
            padding: 30px;
            background-color: #1e1e1e; /* Темный фон для полей по бокам */
        }
        
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Сохраняет пропорции и вписывает картинку целиком */
            z-index: 1;
        }
        
     .card {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            
            /* МАСШТАБИРОВАНИЕ ОКНА: */
            width: 25vw;         /* Ширина карточки ВСЕГДА составляет 25% от ширины экрана */
            min-width: 280px;    /* Но она не сожмется меньше 280px, чтобы текст оставался читаемым */
            max-width: 380px;    /* И не станет огромной на гигантских мониторах */
            
            /* Адаптивные внутренние отступы от высоты экрана */
            padding: 3vh 20px;   
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        
    h1 {
            font-size: clamp(18px, 1.8vw, 24px); /* Уменьшается на маленьком экране */
            margin-bottom: 1vh;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        p {
            font-size: clamp(12px, 1.1vw, 14px); /* Сжимается пропорционально окну */
            color: #e0e0e0;
            margin-bottom: 2vh;
            line-height: 1.4;
        }
        
        .btn {
            display: inline-block;
            background-color: #0076ff;
            color: #fff;
            text-decoration: none;
            padding: 1vh 2vw; /* Высота и ширина кнопки зависят от размера экрана */
            min-padding: 8px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: clamp(11px, 1vw, 14px);
            transition: background-color 0.2s;
        }

        
        .btn:hover {
            background-color: #0056b3;
        }
        
        @media (max-width: 480px) {
            body {
                justify-content: center; 
                align-items: center;
                padding: 15px;
            }
            .card {
                max-width: 100%;
            }
        }
    </style>

</head>
<body>

    <!-- ФОНОВАЯ КАРТИНКА ТЕПЕРЬ ТУТ -->
    <!-- реальное имя ниже -->
    <img src="Revit Add-In Automation Showcase.png" alt="Autodesk Revit Custom Tools" class="bg-image">

    <!-- ИНФОРМАЦИОННАЯ КАРТОЧКА -->
    <div class="card">
        <h1>M-Systems</h1>
        <p>Приветствуем! Сайт находится в разработке. Скоро здесь появится подробная информация о наших плагинах, инструментах автоматизации и решениях для Autodesk Revit.</p>
        
        <a href="mailto:info@example.com" class="btn">Связаться с нами</a>
    </div>

</body>
</html>
